{{define "layout"}}<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{template "title" .}} | Clawdlinux</title>
    <link rel="stylesheet" href="/theme/clawdlinux-theme.css">
    <link rel="stylesheet" href="/static/style.css">
    <meta name="htmx-config" content='{"includeIndicatorStyles":false}'>
    <script src="/static/htmx.min.js"></script>
</head>
<body>
    <nav class="navbar">
        <a class="nav-brand" href="/decisions" aria-label="Clawdlinux decisions">
            <img class="brand-wordmark" src="/theme/clawdlinux-wordmark.svg" alt="Clawdlinux">
            <span class="product-name">decisions</span>
        </a>
        <div class="nav-links">
            <a href="/decisions" class="nav-link">Decisions</a>
            <a href="/receipts" class="nav-link">Receipts</a>
        </div>
    </nav>
    <main class="container">
        {{template "content" .}}
    </main>
    <footer class="footer">
        <span>Clawdlinux</span>
    </footer>
</body>
</html>
{{end}}
