{{- /*
receipt-writer: owns the decision receipt signing key and chain. See
docs/receipts.md. Toggle with global.receipts.enabled (default false).
Runs in the release namespace, next to the operator Deployment.
The signing key must come from an existing Secret. The chart never makes one.
*/ -}}
{{- $r := .Values.global.receipts | default dict -}}
{{- if $r.enabled -}}
{{- if not ($r.signingKey).existingSecret -}}
{{- fail "global.receipts.signingKey.existingSecret is required when global.receipts.enabled=true. The chart never generates the signing key. See docs/receipts.md." -}}
{{- end -}}
{{- if and (not ($r.trustRoot).existingConfigMap) (not $r.insecureNoPin) -}}
{{- fail "global.receipts.trustRoot.existingConfigMap is required when global.receipts.enabled=true. It pins the writer public key. Make it with agentctl receipts trust-root. global.receipts.insecureNoPin=true is for demos only. See docs/receipts.md." -}}
{{- end -}}
{{- $name := printf "%s-receipt-writer" .Release.Name | trunc 63 | trimSuffix "-" -}}
{{- $ns := .Release.Namespace -}}
{{- $port := int ($r.port | default 8080) -}}
{{- $tokenSecret := ($r.token).existingSecret | default (printf "%s-receipt-writer-token" .Release.Name | trunc 63 | trimSuffix "-") -}}
{{- $tokenKey := ($r.token).key | default "token" -}}
{{- $keyKey := ($r.signingKey).key | default "signing-key" -}}
{{- if not ($r.token).existingSecret }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $tokenSecret }}
  namespace: {{ $ns }}
  labels:
    {{- include "agentic-operator.receiptWriter.labels" . | nindent 4 }}
type: Opaque
data:
  {{- $existing := lookup "v1" "Secret" $ns $tokenSecret }}
  {{- if and $existing (index ($existing.data | default dict) $tokenKey) }}
  {{ $tokenKey }}: {{ index $existing.data $tokenKey }}
  {{- else }}
  {{ $tokenKey }}: {{ randAlphaNum 48 | b64enc }}
  {{- end }}
{{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  namespace: {{ $ns }}
  labels:
    {{- include "agentic-operator.receiptWriter.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "agentic-operator.receiptWriter.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ $port }}
      targetPort: http
      protocol: TCP
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $name }}
  namespace: {{ $ns }}
  labels:
    {{- include "agentic-operator.receiptWriter.labels" . | nindent 4 }}
spec:
  # One writer per chain. Never scale above 1.
  replicas: 1
  serviceName: {{ $name }}
  selector:
    matchLabels:
      {{- include "agentic-operator.receiptWriter.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "agentic-operator.receiptWriter.labels" . | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      {{- include "agentic-operator.imagePullSecrets" . | nindent 6 }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: receipt-writer
          image: "{{ ($r.image).repository }}:{{ ($r.image).tag }}"
          imagePullPolicy: {{ ($r.image).pullPolicy | default "IfNotPresent" }}
          env:
            - name: RECEIPT_ADDR
              value: ":{{ $port }}"
            - name: RECEIPT_DATA_DIR
              value: /data
            - name: RECEIPT_KEY_FILE
              value: /etc/receipt-writer/key/{{ $keyKey }}
            - name: RECEIPT_TOKEN_FILE
              value: /etc/receipt-writer/token/{{ $tokenKey }}
          ports:
            - name: http
              containerPort: {{ $port }}
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            {{- toYaml ($r.resources | default dict) | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /data
            - name: signing-key
              mountPath: /etc/receipt-writer/key
              readOnly: true
            - name: token
              mountPath: /etc/receipt-writer/token
              readOnly: true
      volumes:
        - name: signing-key
          secret:
            secretName: {{ $r.signingKey.existingSecret }}
            defaultMode: 0440
        - name: token
          secret:
            secretName: {{ $tokenSecret }}
            defaultMode: 0440
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- $sc := ($r.storage).storageClass | default .Values.global.storageClass }}
        {{- if $sc }}
        storageClassName: {{ $sc }}
        {{- end }}
        resources:
          requests:
            storage: {{ ($r.storage).size | default "1Gi" }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $name }}
  namespace: {{ $ns }}
  labels:
    {{- include "agentic-operator.receiptWriter.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "agentic-operator.receiptWriter.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  # Only operator pods may call the writer. The writer needs no egress.
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: agentic-operator
              app.kubernetes.io/instance: {{ .Release.Name }}
              app.kubernetes.io/component: operator
      ports:
        - port: {{ $port }}
          protocol: TCP
  egress: []
{{- end }}
