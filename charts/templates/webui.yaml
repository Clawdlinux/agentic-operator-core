{{- if .Values.webUI.enabled }}
{{- /* The writer token Secret and trust ConfigMap live in the release namespace.
       Pods can only mount them from the same namespace. */}}
{{- if and (.Values.global.receipts).enabled (ne (include "agentic-operator.namespace" .) .Release.Namespace) }}
{{- fail "webUI with global.receipts.enabled needs global.namespace to match the release namespace, so the web pods can mount the writer token and trust root" }}
{{- end }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "agentic-operator.fullname" . }}-webui
  namespace: {{ include "agentic-operator.namespace" . }}
  labels:
    {{- include "agentic-operator.labels" . | nindent 4 }}
    app.kubernetes.io/component: webui
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "agentic-operator.fullname" . }}-webui
  labels:
    {{- include "agentic-operator.labels" . | nindent 4 }}
    app.kubernetes.io/component: webui
rules:
  # TokenReview for authenticating user tokens
  - apiGroups: ["authentication.k8s.io"]
    resources: ["tokenreviews"]
    verbs: ["create"]
  # SubjectAccessReview for authorization checks
  - apiGroups: ["authorization.k8s.io"]
    resources: ["subjectaccessreviews"]
    verbs: ["create"]
  # Read AgentWorkload CRDs
  - apiGroups: ["agentic.clawdlinux.org"]
    resources: ["agentworkloads", "agentworkloads/status"]
    verbs: ["get", "list", "watch", "patch", "update"]
  # Read cluster info + services for component health
  - apiGroups: [""]
    resources: ["services", "namespaces"]
    verbs: ["get", "list"]
  # Read deployments for operator version detection
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list"]
  # Argo Workflow resume support
  - apiGroups: ["argoproj.io"]
    resources: ["workflows"]
    verbs: ["get", "list", "patch"]
  # Pod logs for workload log streaming
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "agentic-operator.fullname" . }}-webui
  labels:
    {{- include "agentic-operator.labels" . | nindent 4 }}
    app.kubernetes.io/component: webui
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "agentic-operator.fullname" . }}-webui
subjects:
  - kind: ServiceAccount
    name: {{ include "agentic-operator.fullname" . }}-webui
    namespace: {{ include "agentic-operator.namespace" . }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "agentic-operator.fullname" . }}-webui
  namespace: {{ include "agentic-operator.namespace" . }}
  labels:
    {{- include "agentic-operator.labels" . | nindent 4 }}
    app.kubernetes.io/component: webui
spec:
  replicas: {{ .Values.webUI.replicaCount }}
  selector:
    matchLabels:
      {{- include "agentic-operator.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: webui
  template:
    metadata:
      labels:
        {{- include "agentic-operator.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: webui
    spec:
      serviceAccountName: {{ include "agentic-operator.fullname" . }}-webui
      {{- include "agentic-operator.imagePullSecrets" . | nindent 6 }}
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: agentctl-web
          image: "{{ .Values.global.imageRegistry }}/agentctl-web:{{ .Values.webUI.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.webUI.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8090
              protocol: TCP
          args:
            - "--addr=:8090"
            {{- with .Values.global.receipts }}
            {{- if .enabled }}
            # Decision, receipt and chain pages read the receipt-writer.
            - {{ printf "--writer-url=http://%s.%s.svc:%d" (printf "%s-receipt-writer" $.Release.Name | trunc 63 | trimSuffix "-") $.Release.Namespace (int (.port | default 8080)) | quote }}
            - {{ printf "--writer-token-file=/etc/receipts/token/%s" ((.token).key | default "token") | quote }}
            {{- if (.trustRoot).existingConfigMap }}
            - {{ printf "--trust-root=/etc/receipts/trust/%s" ((.trustRoot).key | default "trust.json") | quote }}
            {{- end }}
            {{- end }}
            {{- end }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          {{- if (.Values.global.receipts).enabled }}
          volumeMounts:
            - name: receipts-token
              mountPath: /etc/receipts/token
              readOnly: true
            {{- if ((.Values.global.receipts).trustRoot).existingConfigMap }}
            - name: receipts-trust
              mountPath: /etc/receipts/trust
              readOnly: true
            {{- end }}
          {{- end }}
          resources:
            {{- toYaml .Values.webUI.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
      {{- with .Values.global.receipts }}
      {{- if .enabled }}
      volumes:
        - name: receipts-token
          secret:
            secretName: {{ (.token).existingSecret | default (printf "%s-receipt-writer-token" $.Release.Name | trunc 63 | trimSuffix "-") }}
            defaultMode: 0444
        {{- if (.trustRoot).existingConfigMap }}
        - name: receipts-trust
          configMap:
            name: {{ (.trustRoot).existingConfigMap }}
            items:
              - key: {{ (.trustRoot).key | default "trust.json" }}
                path: {{ (.trustRoot).key | default "trust.json" }}
        {{- end }}
      {{- end }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "agentic-operator.fullname" . }}-webui
  namespace: {{ include "agentic-operator.namespace" . }}
  labels:
    {{- include "agentic-operator.labels" . | nindent 4 }}
    app.kubernetes.io/component: webui
spec:
  type: {{ .Values.webUI.service.type }}
  ports:
    - port: {{ .Values.webUI.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "agentic-operator.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: webui
{{- if .Values.webUI.ingress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "agentic-operator.fullname" . }}-webui
  namespace: {{ include "agentic-operator.namespace" . }}
  labels:
    {{- include "agentic-operator.labels" . | nindent 4 }}
    app.kubernetes.io/component: webui
  {{- with .Values.webUI.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.webUI.ingress.className }}
  ingressClassName: {{ .Values.webUI.ingress.className }}
  {{- end }}
  {{- if .Values.webUI.ingress.tls }}
  tls:
    {{- range .Values.webUI.ingress.tls }}
    - hosts:
        {{- range .hosts }}
        - {{ . | quote }}
        {{- end }}
      secretName: {{ .secretName }}
    {{- end }}
  {{- end }}
  rules:
    - host: {{ .Values.webUI.ingress.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "agentic-operator.fullname" . }}-webui
                port:
                  number: {{ .Values.webUI.service.port }}
{{- end }}
{{- end }}
