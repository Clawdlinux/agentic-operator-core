suite: operator controller RBAC
templates:
  - templates/rbac.yaml
tests:
  - it: grants the running controllers access to AgentWorkload, AgentCard, and Tenant resources
    set:
      license.key: dev-license
    asserts:
      - contains:
          path: rules
          content:
            apiGroups:
              - agentic.clawdlinux.org
            resources:
              - agentworkloads
              - agentcards
              - tenants
            verbs:
              - get
              - list
              - watch
              - create
              - update
              - patch
              - delete
        documentIndex: 1
      - contains:
          path: rules[0].resources
          content: resourcequotas
        documentIndex: 1
      - contains:
          path: rules[0].verbs
          content: watch
        documentIndex: 1
      - contains:
          path: rules
          content:
            apiGroups:
              - rbac.authorization.k8s.io
            resources:
              - roles
              - rolebindings
            verbs:
              - get
              - list
              - watch
              - create
              - update
              - patch
              - delete
        documentIndex: 1
      - contains:
          path: rules
          content:
            apiGroups:
              - agentic.clawdlinux.org
            resources:
              - agentworkloads/status
              - agentcards/status
              - tenants/status
            verbs:
              - get
              - update
              - patch
        documentIndex: 1
      - contains:
          path: rules
          content:
            apiGroups:
              - agentic.clawdlinux.org
            resources:
              - agentworkloads/finalizers
              - agentcards/finalizers
              - tenants/finalizers
            verbs:
              - update
        documentIndex: 1
      - contains:
          path: rules
          content:
            apiGroups:
              - ""
            resources:
              - nodes
            verbs:
              - list
        documentIndex: 1
      - contains:
          path: rules
          content:
            apiGroups:
              - node.k8s.io
            resources:
              - runtimeclasses
            verbs:
              - get
        documentIndex: 1