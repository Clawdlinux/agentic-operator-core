# helm-unittest spec for default-deny egress NetworkPolicy (issue #129).
# Run with: helm unittest charts
suite: networkpolicy default-deny egress
templates:
  - networkpolicy.yaml
tests:
  - it: renders a NetworkPolicy when networkPolicy.enabled=true
    set:
      license:
        key: "test"
        publicKey: "test"
      networkPolicy:
        enabled: true
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: kind
          value: NetworkPolicy
      - equal:
          path: apiVersion
          value: networking.k8s.io/v1
      - equal:
          path: spec.podSelector.matchLabels["app.kubernetes.io/part-of"]
          value: agentic-operator
      - contains:
          path: spec.policyTypes
          content: Egress

  - it: renders nothing when networkPolicy.enabled=false
    set:
      license:
        key: "test"
        publicKey: "test"
      networkPolicy:
        enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: includes DNS allow-rule by default
    set:
      license:
        key: "test"
        publicKey: "test"
      networkPolicy:
        enabled: true
        denyEgressByDefault: true
    asserts:
      - contains:
          path: spec.egress[0].ports
          content:
            port: 53
            protocol: UDP

  - it: renders a policy in each configured workload namespace
    set:
      license:
        key: "test"
        publicKey: "test"
      networkPolicy:
        enabled: true
        workloadNamespaces:
          - tenant-a
          - argo-workflows
    asserts:
      - hasDocuments:
          count: 3
      - equal:
          path: metadata.namespace
          value: tenant-a
        documentIndex: 1
      - equal:
          path: metadata.namespace
          value: argo-workflows
        documentIndex: 2

  - it: does not duplicate the release namespace policy
    set:
      license:
        key: "test"
        publicKey: "test"
      networkPolicy:
        enabled: true
        workloadNamespaces:
          - agentic-system
    asserts:
      - hasDocuments:
          count: 1

  - it: scopes shared service peers to the platform namespace
    set:
      license:
        key: "test"
        publicKey: "test"
      networkPolicy:
        enabled: true
        platformNamespace: platform-services
    asserts:
      - equal:
          path: spec.egress[1].to[0].namespaceSelector.matchLabels["kubernetes.io/metadata.name"]
          value: platform-services
      - equal:
          path: spec.egress[1].to[0].podSelector.matchLabels["app.kubernetes.io/name"]
          value: litellm
