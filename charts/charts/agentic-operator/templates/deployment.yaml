apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "agentic-operator-sub.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "agentic-operator-sub.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "agentic-operator-sub.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "agentic-operator-sub.labels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "agentic-operator-sub.serviceAccountName" . }}
      terminationGracePeriodSeconds: 10
      containers:
        - name: operator
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - /manager
          args:
            - --leader-elect={{ .Values.leaderElection }}
            - --health-probe-bind-address=:8082
            - --metrics-bind-address=:{{ .Values.service.metricsPort }}
            - --zap-log-level={{ .Values.logLevel }}
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: LICENSE_SECRET_NAME
              value: {{ include "agentic-operator-sub.licenseName" . | quote }}
            - name: LICENSE_JWT
              valueFrom:
                secretKeyRef:
                  name: {{ include "agentic-operator-sub.licenseName" . }}
                  key: LICENSE_JWT
                  optional: true
            - name: LICENSE_PUBLIC_KEY_B64
              valueFrom:
                secretKeyRef:
                  name: {{ include "agentic-operator-sub.licenseName" . }}
                  key: LICENSE_PUBLIC_KEY_B64
                  optional: true
            {{- with .Values.global.runtimeSandbox }}
            {{- if .enabled }}
            - name: RUNTIME_SANDBOX_CLASS
              value: {{ .runtimeClassName | default "gvisor" | quote }}
            - name: RUNTIME_SANDBOX_LABEL_KEY
              value: {{ .selectorLabelKey | default "agentic.clawdlinux.org/runtime-sandbox" | quote }}
            - name: RUNTIME_SANDBOX_LABEL_VALUE
              value: {{ .selectorLabelValue | default "gvisor" | quote }}
            - name: RUNTIME_SANDBOX_ENFORCEMENT_MODE
              value: {{ .enforcementMode | default "strict" | quote }}
            {{- end }}
            {{- end }}
            {{- with (.Values.global).receipts }}
            {{- if .enabled }}
            - name: RECEIPTS_ENABLED
              value: "true"
            - name: RECEIPTS_REQUIRED
              value: {{ .required | default false | quote }}
            - name: RECEIPTS_WRITER_URL
              value: {{ printf "http://%s.%s.svc:%d" (printf "%s-receipt-writer" $.Release.Name | trunc 63 | trimSuffix "-") $.Release.Namespace (int (.port | default 8080)) | quote }}
            - name: RECEIPTS_WRITER_TOKEN_FILE
              value: /etc/receipts/token/{{ (.token).key | default "token" }}
            - name: RECEIPTS_WRITER_TIMEOUT
              value: {{ .timeout | default "5s" | quote }}
            {{- end }}
            {{- end }}
            {{- range $key, $val := .Values.env }}
            - name: {{ $key }}
              value: {{ $val | quote }}
            {{- end }}
          envFrom:
            - secretRef:
                name: {{ include "agentic-operator-sub.licenseName" . }}
                optional: false
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
            - name: metrics
              containerPort: {{ .Values.service.metricsPort }}
              protocol: TCP
            - name: health
              containerPort: 8082
              protocol: TCP
            - name: webhook
              containerPort: 9443
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: webhook-certs
              mountPath: /tmp/k8s-webhook-server/serving-certs
              readOnly: true
            {{- if ((.Values.global).receipts).enabled }}
            - name: receipts-token
              mountPath: /etc/receipts/token
              readOnly: true
            {{- end }}
      volumes:
        - name: webhook-certs
          secret:
            secretName: {{ printf "%s-agentic-operator-webhook-tls" .Release.Name | trunc 63 | trimSuffix "-" }}
            optional: true
        {{- with (.Values.global).receipts }}
        {{- if .enabled }}
        - name: receipts-token
          secret:
            secretName: {{ (.token).existingSecret | default (printf "%s-receipt-writer-token" $.Release.Name | trunc 63 | trimSuffix "-") }}
            defaultMode: 0444
        {{- end }}
        {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
